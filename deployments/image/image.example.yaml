# Append this section to an existing valid Resource configuration.
# Disabled until the deployment operator supplies real bindings and private files.
image:
  enabled: false
  database_dsn_file: /run/ani-image/private/runtime-dsn
  installation_id: "<canonical-installation-uuid>"
  harbor_url: https://registry.example.invalid
  harbor_ca_file: /run/ani-image/ca/harbor-ca.pem
  harbor_username: "<backend-management-identity>"
  harbor_password_file: /run/ani-image/private/harbor-password
  robot_name_prefix: "<actual-harbor-robot-prefix>"
  platform_project: "<approved-private-platform-project>"
  encryption_keys_file: /run/ani-image/private/encryption-keys.json
  cursor_signing_key_file: /run/ani-image/private/cursor-key
  request_timeout: 10s
  publisher_days: 30
  pull_days: 365
  allow_never_expires: false
  # The only cluster Image may write shared pull Secrets into. Empty keeps the
  # unified Ensure unavailable (Resolve and the catalog stay usable).
  pull_secret_cluster_id: "<deployment-cluster-id>"
  # Empty uses the pod's in-cluster ServiceAccount. The identity needs the
  # Secret write and Namespace read grants in deployments/image/rbac.yaml.
  pull_secret_kubeconfig: ""
  # Per-runtime-identity authorization. Never accepted from a request body.
  # Inference uses one deployment-wide shared namespace; training requires a
  # one-tenant namespace carrying both resource-tenant-id and managed-by.
  pull_secret_callers:
    - subject: ani-inference-service
      cluster_ids: ["<deployment-cluster-id>"]
      namespaces: ["<ANI_INFERENCE_NAMESPACE>"]
      owner_labels: []
      require_tenant_label: false
    - subject: ani-modeldev-service
      cluster_ids: ["<deployment-cluster-id>"]
      namespaces: ["<modeldev-training-namespace>"]
      owner_labels: ["<bindings[].owner_label.value>"]
      require_tenant_label: true
