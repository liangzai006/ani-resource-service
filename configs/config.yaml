server:
  grpc:
    network: "${SERVER_GRPC_NETWORK:tcp}"
    addr: "${SERVER_GRPC_ADDR:127.0.0.1:19090}"
    timeout: "${SERVER_GRPC_TIMEOUT:1s}"
  admin:
    network: "${SERVER_ADMIN_NETWORK:tcp}"
    addr: "${SERVER_ADMIN_ADDR:127.0.0.1:19091}"
    timeout: "${SERVER_ADMIN_TIMEOUT:1s}"
  shutdown_timeout: "${SERVER_SHUTDOWN_TIMEOUT:5s}"
network:
  # Administrator supplies verified RFC1918 candidates; restart Resource to apply.
  # Empty is fail closed for new VPCs. This example is not live platform policy.
  vpc_cidr_presets: []
  database_dsn: "${NETWORK_DATABASE_DSN:}"
  kubeconfig: "${NETWORK_KUBECONFIG:}"
  cluster_id: "${NETWORK_CLUSTER_ID:primary}"
  namespace_prefix: "${NETWORK_NAMESPACE_PREFIX:tenant-}"
  instance_consumer_endpoint: "${NETWORK_INSTANCE_CONSUMER_ENDPOINT:}"
  cursor_signing_key: "${NETWORK_CURSOR_SIGNING_KEY:}"
  worker:
    lease: "${WORKER_LEASE:20s}"
    request_timeout: "${WORKER_REQUEST_TIMEOUT:5s}"
    observe_every: "${WORKER_OBSERVE_EVERY:10s}"
    stale_after: "${WORKER_STALE_AFTER:60s}"
    retry_min: "${WORKER_RETRY_MIN:1s}"
    retry_max: "${WORKER_RETRY_MAX:60s}"
    poll_interval: "${WORKER_POLL_INTERVAL:0.1s}"
  observation:
    audit_interval: "${OBSERVATION_AUDIT_INTERVAL:30s}"
    audit_jitter: "${OBSERVATION_AUDIT_JITTER:2s}"
    audit_timeout: "${OBSERVATION_AUDIT_TIMEOUT:10s}"
    flush_interval: "${OBSERVATION_FLUSH_INTERVAL:0.1s}"
    queue_capacity: ${OBSERVATION_QUEUE_CAPACITY:4096}
    workers_per_kind: ${OBSERVATION_WORKERS_PER_KIND:2}
    request_qps: ${OBSERVATION_REQUEST_QPS:5}
    request_burst: ${OBSERVATION_REQUEST_BURST:10}
object_storage:
  # 对接已有 S3 兼容服务；endpoint 为空表示本期不启用对象浏览。
  # 新增租户桶需要修改配置并重启，不支持热更新。
  endpoint: "${OBJECT_STORAGE_ENDPOINT:}"
  browser_endpoint: "${OBJECT_STORAGE_BROWSER_ENDPOINT:}"
  region: "${OBJECT_STORAGE_REGION:us-east-1}"
  path_style: true
  credentials_file: "${OBJECT_STORAGE_CREDENTIALS_FILE:}"
  ca_file: "${OBJECT_STORAGE_CA_FILE:}"
  managed_buckets: []
