syntax = "proto3";
package instance.v1;
option go_package = "github.com/zhangzhe-ctrl/ani-resource-service/api/instance/v1;instancev1";

import "accelerator/v1/accelerator.proto";
import "accelerator/command/v1/command.proto";
import "instance/terminal/v1/terminal.proto";
import "google/protobuf/timestamp.proto";

// Trusted Governance listener only. Public HTTP DTOs exclude the frozen fields,
// namespace, tenant, plan and original charges.
service InstanceService {
  rpc GetInstanceRuntime(GetInstanceRequest) returns (InstanceRuntime);
  rpc ListInstanceEvents(GetInstanceRequest) returns (InstanceEvents);
  rpc StreamInstanceLogs(StreamInstanceLogsRequest) returns (stream InstanceLogFrame);
  rpc ListMountablePVCs(ListMountablePVCsRequest) returns (ListMountablePVCsResponse);
  rpc GetInstanceConfiguration(GetInstanceRequest) returns (InstanceConfiguration);
  rpc ResolveCreateSpec(ResolveCreateSpecRequest) returns (CreateSpec);
  rpc AcceptCreate(AcceptCreateRequest) returns (OperationResponse);
  rpc AcceptDelete(AcceptDeleteRequest) returns (OperationResponse);
  rpc Start(ChangeInstanceRequest) returns (OperationResponse);
  rpc Stop(ChangeInstanceRequest) returns (OperationResponse);
  rpc Restart(ChangeInstanceRequest) returns (OperationResponse);
  rpc AttachPVC(AttachPVCRequest) returns (OperationResponse);
  rpc DetachPVC(DetachPVCRequest) returns (OperationResponse);
  rpc ListInstanceMountablePVCs(ListInstanceMountablePVCsRequest) returns (ListMountablePVCsResponse);
  rpc LookupCommandReplay(LookupCommandReplayRequest) returns (OperationResponse);
  rpc GetInstance(GetInstanceRequest) returns (Instance);
  rpc ResolveInstanceMetricScope(GetInstanceRequest) returns (InstanceMetricScope);
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc GetOperation(GetOperationRequest) returns (Operation);
  rpc ResolveTerminalTarget(ResolveTerminalTargetRequest) returns (instance.terminal.v1.TerminalTarget);
}

message SchedulingOptions {
  enum PodPlacement { POD_PLACEMENT_UNSPECIFIED = 0; NONE = 1; COLOCATE_PREFERRED = 2; SPREAD_PREFERRED = 3; }
  optional PodPlacement pod_placement = 1 [json_name = "pod_placement"];
  optional string priority_class_name = 2 [json_name = "priority_class_name"];
}
message CreateInstanceData {
  string name = 1;
  string image_id = 2;
  string image_scope = 3;
  string preset_id = 4;
  reserved 5;
  reserved "preset_version";
  SchedulingOptions scheduling = 6;
  optional string workspace_mount_path = 7 [json_name = "workspace_mount_path"];
  repeated VolumeMount volume_mounts = 8 [json_name = "volume_mounts"];
  NetworkSelection network = 9;
  map<string,string> labels = 10;
  map<string,string> annotations = 11;
  repeated InstanceEnvVar env = 12;
}
message VolumeMount {
  string pvc_name = 1 [json_name = "pvc_name"];
  string mount_path = 2 [json_name = "mount_path"];
  bool read_only = 3 [json_name = "read_only"];
}
message FrozenVolumeMount {
  string cluster_id = 1 [json_name = "cluster_id"];
  string namespace = 2;
  string pvc_name = 3 [json_name = "pvc_name"];
  string pvc_uid = 4 [json_name = "pvc_uid"];
  string mount_path = 5 [json_name = "mount_path"];
  bool read_only = 6 [json_name = "read_only"];
  string ownership = 7;
}
message InstanceEnvVar { string name = 1; string value = 2; }
message NetworkSelection {
  string vpc_id = 1 [json_name = "vpc_id"];
  string subnet_id = 2 [json_name = "subnet_id"];
}
message ListMountablePVCsRequest {
  string tenant_id = 1; uint32 page = 2; uint32 page_size = 3; string name = 4;
}
message MountablePVC {
  string pvc_name = 1 [json_name = "pvc_name"]; string phase = 2;
  string requested_capacity = 3 [json_name = "requested_capacity"];
  repeated string access_modes = 4 [json_name = "access_modes"];
  string volume_mode = 5 [json_name = "volume_mode"];
  bool selectable = 6; string unavailable_reason = 7 [json_name = "unavailable_reason"];
}
message ListMountablePVCsResponse { repeated MountablePVC items = 1; int64 total = 2; }
message InstanceConfiguration {
  string instance_id = 1 [json_name = "instance_id"];
  uint32 instance_contract_version = 2 [json_name = "instance_contract_version"];
  string workspace_mount_path = 3 [json_name = "workspace_mount_path"];
  repeated VolumeMount volume_mounts = 4 [json_name = "volume_mounts"];
  NetworkSelection network = 5;
  map<string,string> labels = 6; map<string,string> annotations = 7;
  repeated InstanceEnvVar env = 8;
  int64 version = 9;
  int64 applied_mount_version = 10 [json_name = "applied_mount_version"];
  PendingMountChange pending_change = 11 [json_name = "pending_change"];
}
// Trusted, managed reference; never accepted directly from public JSON.
message GpuPresetReference {
  string profile_id = 1 [json_name = "profile_id"];
  uint64 profile_version = 2 [json_name = "profile_version"];
  string spec_digest = 3 [json_name = "spec_digest"];
  uint32 devices_per_instance = 4 [json_name = "devices_per_instance"];
  string cluster_id = 5 [json_name = "cluster_id"];
  string pool_id = 6 [json_name = "pool_id"];
  accelerator.v1.SupplyMode mode = 7;
  string model_key = 8 [json_name = "model_key"];
  reserved 9; reserved "shared_memory_mib_per_device";
  int64 memory_mib_per_device = 11 [json_name = "memory_mib_per_device"];
  uint32 core_limit_percent = 10 [json_name = "core_limit_percent"];
}
message GpuSummary {
  string profile_id = 1 [json_name = "profile_id"];
  uint64 profile_version = 2 [json_name = "profile_version"];
  accelerator.v1.SupplyMode mode = 3;
  string model_key = 4 [json_name = "model_key"];
  uint32 devices_per_instance = 5 [json_name = "devices_per_instance"];
  reserved 6,7; reserved "shared_memory_mib_per_device", "shared_memory_mib_total";
  int64 memory_mib_per_device = 9 [json_name = "memory_mib_per_device"];
  int64 memory_mib_total = 10 [json_name = "memory_mib_total"];
  uint32 core_limit_percent = 8 [json_name = "core_limit_percent"];
}
message ResolveCreateSpecRequest {
  string tenant_id = 1;
  CreateInstanceData data = 2;
  string namespace = 3;
  SchedulingOptions scheduling_defaults = 4;
  uint32 instance_contract_version = 5 [json_name = "instance_contract_version"];
}
// One managed business snapshot; GPU values exist only in gpu_execution.resources.
message CreateSpec {
  string name = 1 [json_name = "name"]; string image_id = 2 [json_name = "image_id"]; string image_scope = 3 [json_name = "image_scope"]; string preset_id = 4 [json_name = "preset_id"];
  string image_reference = 5 [json_name = "image_reference"]; string cpu = 6 [json_name = "cpu"]; string memory = 7 [json_name = "memory"];
  string cluster_id = 8 [json_name = "cluster_id"]; string namespace = 9 [json_name = "namespace"]; string service_account = 10 [json_name = "service_account"];
  string storage_class = 11 [json_name = "storage_class"]; string workspace_size = 12 [json_name = "workspace_size"]; string shell = 13 [json_name = "shell"];
  int64 uid = 14 [json_name = "uid"]; int64 gid = 15 [json_name = "gid"];
  string instance_kind = 16 [json_name = "instance_kind"];
  string compute_type = 17 [json_name = "compute_type"];
  SchedulingOptions scheduling = 18 [json_name = "scheduling"];
  string preset_name = 19 [json_name = "preset_name"];
  string preset_code = 20 [json_name = "preset_code"];
  accelerator.v1.GpuExecution gpu_execution = 21 [json_name = "gpu_execution"];
  accelerator.v1.GpuDisplay gpu_display = 22 [json_name = "gpu_display"];
  // Resolver-only managed selection reference, removed from accepted commands.
  GpuPresetReference gpu_selection = 23 [json_name = "gpu_selection"];
  uint32 instance_contract_version = 24 [json_name = "instance_contract_version"];
  string workspace_mount_path = 25 [json_name = "workspace_mount_path"];
  repeated FrozenVolumeMount volume_mounts = 26 [json_name = "volume_mounts"];
  NetworkSelection network = 27;
  map<string,string> labels = 28; map<string,string> annotations = 29;
  repeated InstanceEnvVar env = 30;
}
message CommandContext {
  string tenant_id = 1 [json_name = "tenant_id"];
  string resource_id = 2 [json_name = "resource_id"];
  string operation_id = 3 [json_name = "operation_id"];
  string request_digest = 4 [json_name = "request_digest"];
}
message AcceptCreateRequest {
  reserved 1,2,3,4,5,6;
  reserved "tenant_id", "operation_id", "business", "gpu_owner_attachment", "original_charges", "cpu_owner_attachment";
  CommandContext context = 7;
  CreateSpec spec = 8;
}
message AcceptDeleteRequest {
  reserved 1,2,3,4,6;
  reserved "tenant_id", "operation_id", "gpu_owner_attachment", "original_charges", "cpu_owner_attachment";
  int64 expected_version = 5;
  CommandContext context = 7;
  string create_operation_id = 8 [json_name = "create_operation_id"];
  string instance_kind = 9 [json_name = "instance_kind"];
  string compute_type = 10 [json_name = "compute_type"];
}
message ChangeInstanceRequest {
  string tenant_id = 1;
  string instance_id = 2;
  string idempotency_key = 3;
  int64 expected_version = 4;
}
message AttachPVCRequest {
  string tenant_id = 1; string instance_id = 2; string idempotency_key = 3;
  int64 expected_version = 4; string pvc_name = 5; string mount_path = 6;
  bool read_only = 7; bool restart_if_running = 8;
}
message DetachPVCRequest {
  string tenant_id = 1; string instance_id = 2; string idempotency_key = 3;
  int64 expected_version = 4; string mount_path = 5; bool restart_if_running = 6;
}
message ListInstanceMountablePVCsRequest {
  string tenant_id = 1; string instance_id = 2; uint32 page = 3; uint32 page_size = 4; string name = 5;
}
message LookupCommandReplayRequest {
  string tenant_id = 1; string instance_id = 2; string action = 3; string idempotency_key = 4;
  bytes canonical_intent = 5;
}
message MountConfiguration { repeated VolumeMount volume_mounts = 1 [json_name = "volume_mounts"]; }
message PendingMountChange {
  string operation_id = 1 [json_name = "operation_id"];
  int64 intent_version = 2 [json_name = "intent_version"]; string phase = 3;
  MountConfiguration target_configuration = 4 [json_name = "target_configuration"];
}
message OperationResponse { accelerator.command.v1.DurableOwnerAck durable_owner_ack = 1; bool replayed = 2; }
message GetInstanceRequest { string tenant_id = 1; string instance_id = 2; }
message ListInstancesRequest {
  string tenant_id = 1;
  reserved 2, 3;
  reserved "after_id";
  uint32 page = 4; uint32 page_size = 5;
  string instance_kind = 6 [json_name = "instance_kind"];
  string compute_type = 7 [json_name = "compute_type"];
  string observed_state = 8; string name = 9;
}
message ListInstancesResponse {
  repeated Instance items = 1;
  reserved 2;
  reserved "next_after_id";
  int64 total = 3;
}
message Instance {
  string id = 1; string name = 2; int64 version = 3;
  string desired_state = 4; string observed_state = 5; string reason = 6;
  string image_id = 7; string image_digest = 8; string preset_id = 9;
  reserved 10, 16;
  reserved "preset_version", "instance_type";
  string create_operation_id = 11; string last_operation_id = 12;
  bool compute_cleaned = 13; bool workspace_cleaned = 14; bool quota_returned = 15;
  string instance_kind = 17 [json_name = "instance_kind"];
  string compute_type = 18 [json_name = "compute_type"];
  string cpu = 19; string memory = 20; google.protobuf.Timestamp created_at = 21;
  string workspace_size = 22; string preset_name = 23 [json_name = "preset_name"];
  string preset_code = 24 [json_name = "preset_code"];
  GpuSummary gpu_summary = 25 [json_name = "gpu_summary"];
  SchedulingOptions scheduling = 26;
  string network_state = 27;
  string network_reason = 28;
  bool network_cleaned = 29;
  bool volume_references_released = 30;
  string active_operation_id = 31;
  string execution_run_state = 32;
  int64 applied_mount_version = 33;
}
message EnvironmentSource { string name = 1; string source_type = 2; }
message RuntimeMount { string name = 1; string volume_type = 2; string mount_path = 3; bool read_only = 4; }
message RuntimePod {
  string name = 1; string uid = 2; string node_name = 3; string pod_ip = 4;
  string phase = 5; bool ready = 6; string reason = 7; string message = 8;
  repeated EnvironmentSource environment_sources = 9; repeated RuntimeMount mounts = 10;
}
message RuntimeStatefulSet { optional int32 desired_replicas = 1; optional int32 ready_replicas = 2; }
message InstanceRuntime {
  string instance_id = 1; int64 version = 2; google.protobuf.Timestamp observed_at = 3;
  RuntimePod pod = 4; RuntimeStatefulSet stateful_set = 5;
}
message InstanceEvent {
  string type = 1; string reason = 2; string message = 3;
  google.protobuf.Timestamp last_occurred_at = 4; optional int64 count = 5;
}
message InstanceEvents { optional string pod_uid = 1; google.protobuf.Timestamp observed_at = 2; repeated InstanceEvent events = 3; bool truncated = 4; }
message StreamInstanceLogsRequest { string tenant_id = 1; string instance_id = 2; uint32 tail_lines = 3; bool follow = 4; }
message InstanceLogFrame {
  enum Kind { KIND_UNSPECIFIED = 0; READY = 1; DATA = 2; END = 3; ERROR = 4; }
  Kind kind = 1; bytes data = 2; string reason = 3;
}
message GetOperationRequest { string tenant_id = 1; string operation_id = 2; }
message Operation {
  string id = 1; string instance_id = 2; string action = 3; int64 intent_version = 4; string state = 5; string reason = 6;
  string phase = 7;
  MountConfiguration target_configuration = 8 [json_name = "target_configuration"];
  string final_run_state = 9 [json_name = "final_run_state"];
  int64 applied_mount_version = 10 [json_name = "applied_mount_version"];
  string completion_scope = 11 [json_name = "completion_scope"];
  string failure_reason = 12 [json_name = "failure_reason"];
}
message ResolveTerminalTargetRequest { string tenant_id = 1; string instance_id = 2; int64 expected_version = 3; }

// Persisted scope for historical metrics, independent of current runtime state.
message InstanceMetricScope {
  string tenant_id = 1;
  string instance_id = 2;
  string cluster_id = 3;
  string namespace = 4;
  string container_name = 5;
}
